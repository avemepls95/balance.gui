<mat-card class="content-card">
    <mat-card-header>
        <mat-card-title>My Balance</mat-card-title>
    </mat-card-header>
    <mat-card-content>

        <div class="container positions-block">
            <div class="flex-h-space-between">
                <mat-form-field>
                    <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filter">
                </mat-form-field>
            </div>
            <div class="mat-elevation-z5">

                <table mat-table [dataSource]="dataSource">

                    <ng-container matColumnDef="index">
                        <th mat-header-cell *matHeaderCellDef></th>
                        <td mat-cell *matCellDef="let i = index"> {{i + 1}} </td>
                    </ng-container>

                    <ng-container matColumnDef="username">
                        <th mat-header-cell *matHeaderCellDef> Total </th>
                        <td mat-cell *matCellDef="let debt"> {{debt.user.username}} </td>
                    </ng-container>

                    <ng-container matColumnDef="amount">
                        <th mat-header-cell *matHeaderCellDef><b> {{getTotalAmount()}} </b></th>
                        <td mat-cell *matCellDef="let debt"> {{debt.amount}} </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef></th>
                        <td mat-cell *matCellDef="let item" class="row-actions-td">
                            <div *ngIf="item.amount < 0" class="row-action-buttons" (click)="$event.stopPropagation()">
                                <button class="row-edit-button" mat-icon-button (click)="openTransferCard(item)"
                                    onclick="this.blur()">
                                    <mat-icon>payment</mat-icon>
                                </button>
                            </div>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"
                        [ngClass]="getTotalAmount() > '0' ? 'positive-amount-color' : 'negative-amount-color'"></tr>
                    <tr mat-row *matRowDef="let debt; columns: displayedColumns;"  [hidden]="debt.amount == 0"
                        [ngClass]="debt.amount > '0' ? 'positive-amount-color' : 'negative-amount-color'">
                    </tr>
                </table>
            </div>
        </div>

    </mat-card-content>

</mat-card>
