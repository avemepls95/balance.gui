<mat-card class="content-card">
    <mat-card-header>
        <mat-card-title>Balance</mat-card-title>
    </mat-card-header>
    <mat-card-content>

        <div class="container positions-block">
            <div class="flex-h-space-between">
                <mat-form-field>
                    <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filter">
                </mat-form-field>
            </div>
            <div class="mat-elevation-z5">

                <table mat-table [dataSource]="dataSource" matSort>

                    <ng-container matColumnDef="index">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> № </th>
                        <td mat-cell *matCellDef="let i = index"> {{i + 1}} </td>
                    </ng-container>

                    <ng-container matColumnDef="username">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Username </th>
                        <td mat-cell *matCellDef="let row"> {{row.user.username}} </td>
                        <td mat-footer-cell *matFooterCellDef> Total </td>
                    </ng-container>

                    <ng-container matColumnDef="amount">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Amount </th>
                        <td mat-cell *matCellDef="let row"> {{row.amount}} </td>
                        <td mat-footer-cell *matFooterCellDef> {{totalAmount}} </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns" ></tr>
                    <tr mat-row *matRowDef="let debt; columns: displayedColumns;"
                        [ngClass]="debt.amount > '0' ? 'positive-amount-color' : 'negative-amount-color'">
                    </tr>
                    <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
                </table>
            </div>
        </div>

    </mat-card-content>

</mat-card>
