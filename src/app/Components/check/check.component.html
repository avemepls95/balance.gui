<mat-card class="check-card">
  <mat-card-header>
    <mat-card-title>Check creating</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-form-field class="check-title-input">
      <input matInput placeholder="Title" [formControl]="titleFormControl" [errorStateMatcher]="matcher">
      <mat-error *ngIf="titleFormControl.hasError('required')">
        Title is <strong>required</strong>
      </mat-error>
    </mat-form-field>

    <mat-form-field>
      <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filter">
    </mat-form-field>
    <div class="container text-center">
      <button mat-button (click)="openDialog('Add',{})" mat-flat-button color="primary">Add Row</button>
      <div class="mat-elevation-z5">

        <table mat-table [dataSource]="dataSource" matSort>

          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Title </th>
            <td mat-cell *matCellDef="let row"> {{row.title}} </td>
          </ng-container>

          <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Amount </th>
            <td mat-cell *matCellDef="let row"> {{row.amount}} </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;">
          </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
      </div>
    </div>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button>CREATE</button>
  </mat-card-actions>
</mat-card>
