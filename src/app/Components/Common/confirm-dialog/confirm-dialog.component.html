<h1 mat-dialog-title>
    {{title}}
  </h1>
  
  <div mat-dialog-content>
    <p>{{message}}</p>
  </div>
  
  <div mat-dialog-actions>
    <button mat-button (click)="onDismiss()">
      <span [translate]="'common.no'"></span>
    </button>
    <button mat-raised-button color="primary" (click)="onConfirm()">
      <span [translate]="'common.yes'"></span>
    </button>
  </div>
