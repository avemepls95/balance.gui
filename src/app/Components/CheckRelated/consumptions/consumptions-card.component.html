<div [formGroup]="myForm">
    <mat-card *ngFor="let consumption of consumptions; index as i; let errorMessage of errorMessages">
        <mat-card-content>
            <div>
                <mat-form-field>
                    <input matInput id="user-input-{{i}}" placeholder="User" [matAutocomplete]="auto"
                        formControlName="userControl{{i}}" [readonly]="action == 'View'">
                    <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn"
                        (optionSelected)="selectedUser($event, consumption)">
                        <mat-option class="is-loading" *ngIf="isLoading" [disabled]="true">
                            <mat-progress-bar mode="indeterminate"></mat-progress-bar>
                        </mat-option>
                        <ng-container *ngIf="!isLoading">
                            <mat-option *ngFor="let user of filteredUsers" [value]="user">
                                <span>{{user.username}}</span>
                            </mat-option>
                        </ng-container>
                    </mat-autocomplete>
                </mat-form-field>

                <br>
                <ng-container>
                    {{errorMessage}}
                </ng-container>
            </div>
            <!-- <mat-form-field>
                <input matInput required DigitOnly="true" type="text" placeholder="Amount" [readonly]="action == 'View'"
                    [(ngModel)]="consumption.amount">
            </mat-form-field> -->

        </mat-card-content>
    </mat-card>
</div>
