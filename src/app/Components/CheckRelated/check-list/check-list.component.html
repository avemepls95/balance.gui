<mat-card class="content-card">
    <mat-card-header>
        <mat-card-title>Checks</mat-card-title>
    </mat-card-header>
    <mat-card-content>

        <div class="container positions-block">
            <div class="flex-h-space-between">
                <mat-form-field>
                    <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filter">
                </mat-form-field>
                <button class="add-row-button" mat-button mat-flat-button color="primary"
                    [routerLink]="'../createCheck'">
                    + Add Check
                </button>
            </div>
            <div class="mat-elevation-z5">

                <table mat-table [dataSource]="dataSource" matSort>

                    <ng-container matColumnDef="index">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> № </th>
                        <td mat-cell *matCellDef="let i = index"> {{i + 1}} </td>
                    </ng-container>

                    <ng-container matColumnDef="title">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Title </th>
                        <td mat-cell *matCellDef="let check">
                            <div>
                                <span> {{check.title}} </span>
                                <mat-icon [style.visibility]="!check.isReadyForProcess ? 'visible' : 'hidden'"
                                    class="green">done</mat-icon>
                            </div>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef></th>
                        <td mat-cell *matCellDef="let check" class="row-actions-td">
                            <div class="row-action-buttons" (click)="$event.stopPropagation()">
                                <button [style.visibility]="check.isReadyForProcess ? 'visible' : 'hidden'"
                                    mat-icon-button (click)="deleteCheck(check.id)" onclick="this.blur()" matTooltip="Delete check">
                                    <mat-icon class="red">delete</mat-icon>
                                </button>
                            </div>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let check; columns: displayedColumns;"
                        [routerLink]="['../editCheck', check.id]"></tr>
                </table>

                <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
            </div>
        </div>

    </mat-card-content>

</mat-card>
