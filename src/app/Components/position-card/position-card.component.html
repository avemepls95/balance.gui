<h1 mat-dialog-title>{{action}} Position</h1>
<div mat-dialog-content>
  <div *ngIf="action != 'Delete'; else elseTemplate">
    <mat-form-field>
      <input placeholder="Title" matInput [(ngModel)]="local_data.title">
    </mat-form-field>
    <mat-form-field>
      <input placeholder="Amount" matInput [(ngModel)]="local_data.amount">
    </mat-form-field>
  </div>
  <ng-template #elseTemplate>
    Sure to 1delete <b>{{local_data.title}}</b>?
  </ng-template>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="doAction()">{{action}}</button>
  <button mat-button (click)="closeDialog()" mat-flat-button color="warn">Cancel</button>
</div>
