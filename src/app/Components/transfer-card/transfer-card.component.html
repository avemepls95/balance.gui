<h1 mat-dialog-title>Register transfer</h1>
<div mat-dialog-content class="position-dialog">
    <div>
        <mat-form-field>
            <input matInput required DigitOnly="true" type="text" placeholder="Amount"
                [(ngModel)]="amount">
        </mat-form-field>
    </div>
</div>
<div mat-dialog-actions>
    <button mat-button (click)="closeDialog()" mat-flat-button color="warn">Cancel</button>
    <button mat-button (click)="doAction()" mat-flat-button [disabled]="!canRegister()">Register</button>
</div>
