<mat-card class="content-card" *ngIf="!isZeroBalance && debts != null">
    <mat-card-header>
        <mat-card-title [translate]="'balance.myBalance'"></mat-card-title>
    </mat-card-header>
    <mat-card-content>

        <div class="container positions-block">
            <div class="flex-h-space-between">
                <mat-form-field>
                    <input matInput (keyup)="applyFilter($event.target.value)" placeholder="{{ 'common.filter' | translate }}">
                </mat-form-field>
            </div>
            <div>

                <table mat-table [dataSource]="dataSource">

                    <ng-container matColumnDef="index">
                        <th mat-header-cell *matHeaderCellDef></th>
                        <td mat-cell *matCellDef="let i = index"> {{i + 1}} </td>
                    </ng-container>

                    <ng-container matColumnDef="username">
                        <th mat-header-cell *matHeaderCellDef [translate]="'balance.total'"></th>
                        <td mat-cell *matCellDef="let debt"> {{debt.user.username}} </td>
                    </ng-container>

                    <ng-container matColumnDef="amount">
                        <th mat-header-cell *matHeaderCellDef><b> {{getTotalAmount()}} </b></th>
                        <td mat-cell *matCellDef="let debt"> {{debt.amount}} </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef></th>
                        <td mat-cell *matCellDef="let item" class="row-actions-td">
                            <div *ngIf="item.amount < 0" class="row-action-buttons" (click)="$event.stopPropagation()">
                                <button class="row-edit-button" mat-icon-button (click)="openTransferCard(item)"
                                    onclick="this.blur()" matTooltip="{{ 'menu.makeTransfer' | translate }}">
                                    <mat-icon>payment</mat-icon>
                                </button>
                            </div>
                            <div *ngIf="item.amount > 0" class="row-action-buttons" (click)="$event.stopPropagation()">
                                <button class="row-edit-button" mat-icon-button onclick="this.blur()" [matMenuTriggerFor]="dropdownMenu">
                                    <mat-icon class="icon-font-large" >
                                        more_horiz
                                    </mat-icon>
                                </button>
                            </div>
                            <mat-menu #dropdownMenu x-position="before" class="balance-actions-menu">
                                <a mat-menu-item (click)="openDebtRepaidCard(item)">
                                    <mat-icon class="green">done</mat-icon>
                                    <span [translate]="'transfer.commitDebtRepaid'"></span>
                                </a>
                                <a mat-menu-item (click)="remind(item)">
                                    <mat-icon class="orange">notification_important</mat-icon>
                                    <span [translate]="'balance.remind'"></span>
                                </a>
                            </mat-menu>
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="displayedColumns"
                        [ngClass]="getTotalAmount() > 0 ? 'positive-amount-color' : 'negative-amount-color'"></tr>
                    <tr mat-row *matRowDef="let debt; columns: displayedColumns;" [hidden]="debt.amount == 0"
                        [ngClass]="debt.amount > '0' ? 'positive-amount-color' : 'negative-amount-color'">
                    </tr>
                </table>
            </div>
        </div>
    </mat-card-content>

</mat-card>

<div class="zero-balance-wrap" *ngIf="isZeroBalance">
    <h1 [translate]="'balance.yourBalanceIs'" [translateParams]="{amount: '0'}"></h1>
    <img src="assets/images/balance.png">
</div>
