<fieldset [disabled]="action == 'View'">

  <h1 mat-dialog-title *ngIf="action == 'Add'" [translate]="'check.addPosition'"></h1>
  <h1 mat-dialog-title *ngIf="action == 'Edit'" [translate]="'check.editPosition'"></h1>
  <h1 mat-dialog-title *ngIf="action == 'Delete'" [translate]="'check.deletePosition'"></h1>
  <div mat-dialog-content class="position-dialog">
    <div *ngIf="action != 'Delete'; else elseTemplate">
      <mat-form-field>
        <input placeholder="{{ 'check.title' | translate }}" required matInput [(ngModel)]="position.title">
      </mat-form-field>
      <div class="flex-h-space-between">
        <mat-form-field [ngClass]="position.applyDiscount ? 'w-48' : 'w-100'">
          <input matInput type="number" required Mask="^\d*\.?\d{0,2}$" placeholder="{{ 'check.amount' | translate }}"
            [(ngModel)]="position.amountWithoutDiscount" [disabled]="!equalConsumptions"
            (change)="onAmountWithoutDiscountChanged()">
        </mat-form-field>
        <mat-form-field *ngIf="position.applyDiscount" class="w-48">
          <input matInput placeholder="{{ 'check.discount.withDiscount' | translate }}" [(ngModel)]="position.amount"
            [disabled]="true">
        </mat-form-field>
      </div>

      <div class="equal-consumptions-block">
        <mat-checkbox [(ngModel)]="equalConsumptions" (change)="equalConsumptionsValueChanged($event)"
          [disabled]="action == 'View'">
          <span [translate]="'check.equalConsumptions'"></span>
        </mat-checkbox>

        <button mat-button (click)="openConsumptions()" [hidden]="equalConsumptions" onclick="this.blur()"
          [disabled]="action == 'View'">
          <mat-icon mat-list-icon class='process-check-icon'>open_in_new</mat-icon>
        </button>
      </div>

      <div>
        <mat-form-field>
          <mat-chip-list #chipList [disabled]="!equalConsumptions">
            <mat-chip *ngFor="let consumption of position.consumptions" [selectable]="selectable"
              [removable]="removable" (removed)="removeConsumption(consumption)">
              {{consumption.user.username}} - {{consumption.amount}}
              <mat-icon matChipRemove *ngIf="removable">cancel</mat-icon>
            </mat-chip>
            <input matInput #usersInput placeholder="{{ 'check.searchUsers' | translate }}" aria-label="State"
              [matAutocomplete]="auto" [formControl]="searchUserCtrl" [matChipInputFor]="chipList"
              [matChipInputSeparatorKeyCodes]="separatorKeysCodes" [matChipInputAddOnBlur]="addOnBlur">
          </mat-chip-list>
          <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selectedUser($event)">
            <mat-option class="is-loading" *ngIf="isLoading" [disabled]="true">
              <mat-progress-bar mode="indeterminate"></mat-progress-bar>
            </mat-option>
            <ng-container *ngIf="!isLoading">
              <mat-option *ngFor="let user of filteredUsers" [value]="user.id">
                <span>{{user.username}}</span>
              </mat-option>
            </ng-container>
          </mat-autocomplete>
        </mat-form-field>
        <br>
        <ng-container *ngIf="errorMsg">
          {{errorMsg}}
        </ng-container>
      </div>

      <mat-checkbox *ngIf="checkDiscount.apply" [(ngModel)]="position.applyDiscount"
        (change)="applyDiscountValueChanged($event)" [disabled]="action == 'View'">
        <span [translate]="'check.discount.applyDiscount'"></span>
      </mat-checkbox>

    </div>

    <ng-template #elseTemplate>
      <span [translate]="'common.sureToDelete'"></span> <b> {{position.title}}</b>?
    </ng-template>
  </div>

</fieldset>

<div mat-dialog-actions>
  <button mat-button (click)="closeDialog()" mat-flat-button color="warn">
    <span [translate]="'common.cancel'"></span>
  </button>
  <button mat-button (click)="doAction()" [hidden]="action == 'View'" [disabled]="!canBeCreated()">OK</button>
</div>
