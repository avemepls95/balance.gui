<div [formGroup]="myForm">
    <h2 class="header-title">Расходы</h2>
    <mat-card
        *ngFor="let consumption of consumptions; index as i;let errorMessageVisible of errorMessageVisibilityArray">
        <div class="consumption-block">
            <mat-card-content>
                <div>
                    <mat-form-field>
                        <input matInput id="user-input-{{i}}" placeholder="Поиск человека..."
                            [matAutocomplete]="auto" formControlName="userControl{{i}}" [readonly]="action == 'View'">
                        <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn"
                            (optionSelected)="selectedUser($event, consumption)">
                            <mat-option class="is-loading" *ngIf="isLoading" [disabled]="true">
                                <mat-progress-bar mode="indeterminate"></mat-progress-bar>
                            </mat-option>
                            <ng-container *ngIf="!isLoading">
                                <mat-option *ngFor="let user of filteredUsers" [value]="user">
                                    <span>{{user.username}}</span>
                                </mat-option>
                            </ng-container>
                        </mat-autocomplete>
                    </mat-form-field>

                    <br>
                    <ng-container *ngIf="errorMessageVisible">
                        <div style="margin-bottom: 5px;">
                            <span id="error-message-{{i}}"></span>
                        </div>
                    </ng-container>
                </div>
                <mat-form-field>
                    <input matInput required type="text" Mask="^\d*\.?\d{0,2}$" placeholder="Сумма"
                        [readonly]="action == 'View'" [(ngModel)]="consumption.amountWithoutDiscount"
                        (change)="onAmountWithoutDiscountChanged(consumption)" [ngModelOptions]="{standalone: true}">
                </mat-form-field>

                <mat-form-field *ngIf="discountInfo.apply">
                    <input matInput placeholder="Со скидкой" [(ngModel)]="consumption.amount" [disabled]="true"
                        [ngModelOptions]="{standalone: true}">
                </mat-form-field>

            </mat-card-content>

            <button mat-button (click)="deleteConsumption(i)" onclick="this.blur()" color="primary">
                <mat-icon class='red'>delete</mat-icon>
            </button>
        </div>
    </mat-card>
    <button class="w-100" mat-button (click)="addEmptyConsumption()" mat-flat-button color="primary"
        matTooltip="Добавить Расход" [disabled]="!canAdd()">
        + <span>Расход</span>
    </button>
</div>

<div mat-dialog-actions>
    <button mat-button (click)="closeDialog()" mat-flat-button color="warn">
        <span>Отмена</span>
    </button>
    <button mat-button (click)="doAction()" [hidden]="action == 'View'" [disabled]="!canBeCreated()">OK</button>
</div>
