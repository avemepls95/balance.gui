<mat-card class="content-card">
    <mat-card-header>
        <mat-card-title [translate]="'check.checks'"></mat-card-title>
    </mat-card-header>
    <mat-card-content>

        <div class="container positions-block">
            <div class="flex-h-flex-end">
                <button class="add-row-button" mat-button mat-flat-button color="primary"
                    [routerLink]="'../createCheck'">
                    + <span [translate]="'check.check'"></span>
                </button>
            </div>
            <div class="mat-elevation-z5">

                <table mat-table [dataSource]="checks" matSort>

                    <ng-container matColumnDef="createdAt">
                        <th mat-header-cell *matHeaderCellDef>
                            <div><span [translate]="'check.createdAt'"></span></div>
                        </th>
                        <td mat-cell *matCellDef="let check"> {{check.createdAt | date:'dd.MM.yy'}} </td>
                    </ng-container>


                    <ng-container matColumnDef="title">
                        <th mat-header-cell *matHeaderCellDef>
                            <div><span [translate]="'check.title'"></span></div>
                        </th>
                        <td mat-cell *matCellDef="let check">
                            <div>
                                <span> {{check.title}} </span>
                                <mat-icon
                                    [style.visibility]="check.state == CHECK_STATE.PROCESSED ? 'visible' : 'hidden'"
                                    class="green">done</mat-icon>
                            </div>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef></th>
                        <td mat-cell *matCellDef="let check" class="row-actions-td">
                            <div class="row-action-buttons" (click)="$event.stopPropagation()">
                                <button [hidden]="!checkActionsVisible(check.id)" mat-icon-button
                                    (click)="deleteCheck(check.id)" onclick="this.blur()"
                                    matTooltip="{{ 'check.delete' | translate }}">
                                    <mat-icon class="red">delete</mat-icon>
                                </button>
                            </div>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let check; columns: displayedColumns;"
                        [routerLink]="['../editCheck', check.id]"></tr>
                </table>

                <div class="more-items" *ngIf="!noMoreItems">
                    <button mat-icon-button (click)="loadNextSet()" onclick="this.blur()"
                        matTooltip="{{ 'checkList.loadNextSet' | translate }}">
                        <mat-icon class="icon-font-large dark-gray">expand_more</mat-icon>
                    </button>
                </div>
            </div>
        </div>

    </mat-card-content>

</mat-card>
