<mat-card class="content-card">
  <mat-card-header>
    <div class='flex-h-space-between header-row'>
      <mat-card-title *ngIf="mode == 'creating'" [translate]="'check.checkCreating'"></mat-card-title>
      <mat-card-title *ngIf="mode == 'editing'" [translate]="'check.checkEditing'"></mat-card-title>
      <button *ngIf="check.isReadyForProcess" class="process-check-button" mat-button (click)="processCheck()"
        mat-flat-button matTooltip="Calculate debts">
        <mat-icon mat-list-icon color="primary" class='process-check-icon'>refresh</mat-icon>
        <span [translate]="'check.process'"></span>
      </button>
      <button *ngIf="check.state == 'PROCESSED'" class="rollback-check-button" mat-button (click)="rollbackCheck()"
        mat-flat-button>
        <mat-icon mat-list-icon class='process-check-icon'>cancel</mat-icon>
        <span [translate]="'check.rollback'"></span>
      </button>
    </div>
  </mat-card-header>
  <mat-card-content>
    <mat-form-field class="width-100-percents">
      <input matInput [(ngModel)]="check.title" placeholder="{{ 'check.title' | translate }}" [formControl]="titleFormControl"
        [errorStateMatcher]="matcher">
      <mat-error *ngIf="titleFormControl.hasError('required')" [translate]="'common.fieldRequired'">
      </mat-error>
    </mat-form-field>

    <mat-form-field class="width-100-percents" *ngIf="mode == 'editing'">
      <input matInput placeholder="{{ 'check.createdAt' | translate }}" value="{{check.createdAt | date:'dd.MM.yyyy hh:mm'}}" [readonly]="true">
    </mat-form-field>

    <!-- Position table -->
    <div class="container positions-block">
      <div class="flex-h-space-between">
        <div class="flex header-label-wrap">
          <mat-icon mat-list-icon color="primary">reorder</mat-icon>
          <mat-card-title class="positions-label" [translate]="'check.positions'"></mat-card-title>
        </div>
        <button class="add-row-button" mat-button (click)="openPositionCard('Add',{})" mat-flat-button color="primary"
          matTooltip="Add position" [hidden]="check.state == 'PROCESSED'">
          + <span [translate]="'check.position'"></span>
        </button>
      </div>
      <div class="mat-elevation-z5" *ngIf="this.check.positions.length != 0">

        <table mat-table [dataSource]="positionsDataSource" matSort>

          <ng-container matColumnDef="index">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> № </th>
            <td mat-cell *matCellDef="let i = index"> {{i + 1}} </td>
            <td mat-footer-cell *matFooterCellDef></td>
          </ng-container>

          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              <span [translate]="'check.title'"></span>
            </th>
            <td mat-cell *matCellDef="let row"> {{row.title}} </td>
            <td mat-footer-cell *matFooterCellDef [translate]="'check.amount'"></td>
          </ng-container>

          <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              <span [translate]="'check.amount'"></span>
            </th>
            <td mat-cell *matCellDef="let row"> {{row.amount}} </td>
            <td mat-footer-cell *matFooterCellDef><b>{{getPositionsTotalAmount()}}</b></td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let item" class="row-actions-td">
              <div class="row-action-buttons" (click)="$event.stopPropagation()">
                <button class="row-edit-button" mat-icon-button (click)="openPositionCard('Edit', item)"
                  onclick="this.blur()" matTooltip="Edit position">
                  <mat-icon>edit</mat-icon>
                </button>
                <button class="row-remove-button" mat-icon-button (click)="openPositionCard('Delete', item)"
                  onclick="this.blur()" matTooltip="Delete position">
                  <mat-icon class="red">delete</mat-icon>
                </button>
              </div>
            </td>
            <td mat-footer-cell *matFooterCellDef></td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="getPositionsDisplayedColumns()" style="display: none;"></tr>
          <tr mat-row *matRowDef="let row; columns: getPositionsDisplayedColumns();"
            (click)="openPositionCard('View',row)">
          </tr>
          <tr mat-footer-row *matFooterRowDef="getPositionsDisplayedColumns()"></tr>
        </table>

      </div>
    </div>

    <!-- Payments table -->
    <div class="container payments-block">
      <div class="flex-h-space-between">
        <div class="flex header-label-wrap">
          <mat-icon mat-list-icon color="primary">reorder</mat-icon>
          <mat-card-title class="positions-label" [translate]="'check.payments'"></mat-card-title>
        </div>
        <button class="add-row-button" mat-button (click)="openPaymentCard('Add',{})" mat-flat-button color="primary"
          matTooltip="Add payment" [hidden]="check.state == 'PROCESSED'">
          + <span [translate]="'check.payment'"></span>
        </button>
      </div>
      <div class="mat-elevation-z5" *ngIf="this.check.payments.length != 0">

        <table mat-table [dataSource]="paymentsDataSource" matSort>

          <ng-container matColumnDef="index">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> № </th>
            <td mat-cell *matCellDef="let i = index"> {{i + 1}} </td>
          </ng-container>

          <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              <span [translate]="'check.user'"></span>
            </th>
            <td mat-cell *matCellDef="let row"> {{row.user.username}} </td>
          </ng-container>

          <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              <span [translate]="'check.amount'"></span>
            </th>
            <td mat-cell *matCellDef="let row"> {{row.amount}} </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let item" class="row-actions-td">
              <div class="row-action-buttons" (click)="$event.stopPropagation()">
                <button class="row-edit-button" mat-icon-button (click)="openPaymentCard('Edit', item)"
                  onclick="this.blur()" matTooltip="Edit payment">
                  <mat-icon>edit</mat-icon>
                </button>
                <button class="row-remove-button" mat-icon-button (click)="openPaymentCard('Delete', item)"
                  onclick="this.blur()" matTooltip="Delete payment">
                  <mat-icon class="red">delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="getPaymentsDisplayedColumns();" style="display: none;"></tr>
          <tr mat-row *matRowDef="let row; columns: getPaymentsDisplayedColumns();"
            (click)="openPaymentCard('View', row)">
          </tr>
        </table>

      </div>
    </div>

  </mat-card-content>

  <mat-card-actions class="create-check-btn-wrap">
    <button mat-button *ngIf="mode == 'creating' && !check.id" (click)="createCheck()">
      <span [translate]="'check.create'"></span>
    </button>
    <button mat-button *ngIf="check.state == 'EDITING'" (click)="updateCheck()">
      <span [translate]="'check.edit'"></span>
    </button>
  </mat-card-actions>
</mat-card>
