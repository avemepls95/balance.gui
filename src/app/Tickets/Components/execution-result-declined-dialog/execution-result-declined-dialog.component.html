<h1 mat-dialog-title>Отклонение участия</h1>
<div mat-dialog-content class="position-dialog">
  <mat-form-field>
    <mat-label>Описание</mat-label>
    <textarea
      matInput
      required
      cdkTextareaAutosize
      cdkAutosizeMinRows="3"
      cdkAutosizeMaxRows="5"
      [formControl]="commentFormControl"
      [errorStateMatcher]="matcher"
    ></textarea>
    <mat-error *ngIf="commentFormControl.hasError('required')"
      >Поле заполни э (тебе весело э)</mat-error
    >
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="closeDialog()" mat-flat-button color="warn">
    <span>Отмена</span>
  </button>
  <button
    mat-button
    (click)="doAction()"
    mat-flat-button
  >
    <span>ОК</span>
  </button>
</div>
